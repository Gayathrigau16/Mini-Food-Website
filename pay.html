<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zestio</title>
    <link rel="stylesheet" href="pay.css" />
    <!-- bootsrap link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div class="arrow">
        <a href="select1.html"><i class="bi bi-arrow-left"></i></a>
    </div>

    <div class="container">
        <h1>Burger</h1>
        <div class="notification">✅ Saved $5! Why free delivery.</div>
        <div class="card">
            <h2>Kings Burger</h2>
            <div class="quantity-control">

                <span id="quantity">5</span>
                <button id="increase">+</button>

            <div class="price">$50</div>

            <div class="options">
                <button class="option-btn">+ Add More Item</button>
                <button class="option-btn">Add Cooking Request</button>
            </div>

            <a href="home.html" style="text-decoration: none; color: white;"><button id="payBtn">Proceed to
                    Pay</button></a>
        </div>
    </div>

    <script src="pay.js"></script>
