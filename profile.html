<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zestio</title>
    <link rel="stylesheet" href="profile.css">
    <!-- bootsrap link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div class="arrow">
        <a href="home.html"><i class="bi bi-arrow-left"></i></a>
    </div>
    <div class="profile-img">
        <img src="food/images.jpg" alt="profile" width="200px" height="200px">
    </div>
    <div class="profiledetails">
        <div class="details">
            <p>Name</p>
            <input type="text" id="name" placeholder="Enter your name">
        </div>
        <div class="details">
            <p>Place</p>
            <input type="text" id="place" placeholder="Enter your Place">
        </div>
        <div class="details">
            <p>Pin code</p>
            <input type="tel" id="pincode" placeholder="Enter your Pin code" maxlength="6">
        </div>
        <div class="details">
            <p>Mobile Number</p>
            <input type="tel" id="mobilenumber" placeholder="Enter your Mobile Number" maxlength="10">
        </div>
        <button>Save</button>
        <p class="error" id="errorMsg"></p>

    </div>
    <script src="profile.js"></script>
</body>

</html>
