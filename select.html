<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zestio</title>
    <link rel="stylesheet" href="select.css" />
    <!-- bootsrap link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div class="arrow">
        <a href="biriyani.html"><i class="bi bi-arrow-left"></i></a>
    </div>
    <div class="container">
        <header class="featured">
            <h2>Vishnu Hotel</h2>
            <p class="rating">⭐ 4.5 (560 ratings)</p>
            <p class="cuisine">Chinish, North Indian • Anna Nagar</p>
            <p class="delivery">⏱️ 25–30 mins</p>
            <p class="offer">🔥 50% Off Upto $20</p>
        </header>

        <section class="restaurant-list">
            <div class="card">
                <div class="info">
                    <h3>Andavar Hotel</h3>
                    <p class="rating">⭐ 4.5</p>
                    <p class="desc">A tempting Biriyani with rich spices</p>
                    <p class="price">$5</p>
                    <button onclick="addToCart('Andavar Hotel')">Add</button>
                </div>
                <img src="food/briyani.avif" alt="Biriyani" width="200px" height="200px" />
            </div>

            <div class="card">
                <div class="info">
                    <h3>Bhavani Hotel</h3>
                    <p class="rating">⭐ 4.7</p>
                    <p class="desc">A tempting pizza with cheesy layers</p>
                    <p class="price">$10</p>
                    <button onclick="addToCart('Bhavani Hotel')">Add</button>
                </div>
                <img src="food/pizza.jpg" alt="Pizza" width="200px" height="200px" />
            </div>
            <a href="select1.html" style="text-decoration: none; color: white;"><button
                    class="Continue-btn">Continue</button></a>
        </section>
    </div>

    <script src="select.js"></script>
</body>

</html>
