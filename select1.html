<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vishnu Hotel - Customize Item</title>
  <link rel="stylesheet" href="select1.css" />
  <!-- bootsrap link -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
  <div class="arrow">
    <a href="select.html"><i class="bi bi-arrow-left"></i></a>
  </div>
  <div class="container">
    <header>
      <h1>Vishnu Hotel</h1>
      <p class="rating">⭐ 4.5 (560 ratings)</p>
    </header>

    <section class="item-card">
      <h2>Customize as per your taste</h2>
      <div class="price">$50</div>

      <div class="portion">
        <label for="portion">Portion Size:</label>
        <select id="portion">
          <option value="450gms">450gms - $50</option>
        </select>
      </div>

      <div class="raita-choice">
        <p>Choice of Raita:</p>
        <label><input type="checkbox" value="onion" /> Onion Raita (60g)</label>
        <label><input type="checkbox" value="plain" /> Plain Raita (60g)</label>
      </div>

      <a href="pay.html" style="text-decoration: none; color: white;"><button id="addToCart">Add item to
          Cart</button></a>
    </section>
  </div>

  <script src="select1.js"></script>
</body>

</html>
